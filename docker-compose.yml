services:
  verificador:
    build: .
    image: verificador-abnt
    ports:
      - "8000:8000"
    environment:
      REGRAS: /app/regras/utfpr.yaml   # troque para usar outro conjunto de regras
      TAMANHO_MAX_MB: "60"
      WORKERS: "2"
    volumes:
      - ./regras:/app/regras:ro         # permite ajustar as regras sem reconstruir a imagem
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
